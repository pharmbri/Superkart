<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperKart Sales Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            color: #0056b3;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"],
        input[type="text"],
        select {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #predictionResult {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            border: 1px solid #ced4da;
            font-size: 1.1em;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SuperKart Sales Predictor</h1>
        <p>Enter the product and store details to predict sales.</p>

        <form id="predictionForm">
            <label for="Product_Weight">Product Weight:</label>
            <input type="number" id="Product_Weight" name="Product_Weight" step="0.01" value="10.5" required>

            <label for="Product_Sugar_Content">Product Sugar Content:</label>
            <select id="Product_Sugar_Content" name="Product_Sugar_Content" required>
                <option value="Low Sugar">Low Sugar</option>
                <option value="Regular">Regular</option>
                <option value="No Sugar">No Sugar</option>
            </select>

            <label for="Product_Allocated_Area">Product Allocated Area (e.g., 0.05):</label>
            <input type="number" id="Product_Allocated_Area" name="Product_Allocated_Area" step="0.01" value="0.05" required>

            <label for="Product_MRP">Product MRP (Max. Retail Price):</label>
            <input type="number" id="Product_MRP" name="Product_MRP" step="0.01" value="150.0" required>

            <label for="Product_Type">Product Type:</label>
            <select id="Product_Type" name="Product_Type" required>
                <option value="Dairy">Dairy</option>
                <option value="Baking Goods">Baking Goods</option>
                <option value="Snack Foods">Snack Foods</option>
                <option value="Frozen Foods">Frozen Foods</option>
                <option value="Fruits and Vegetables">Fruits and Vegetables</option>
                <option value="Household">Household</option>
                <option value="Beverages">Beverages</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Health and Hygiene">Health and Hygiene</option>
                <option value="Meat">Meat</option>
                <option value="Seafood">Seafood</option>
                <option value="Soft Drinks">Soft Drinks</option>
                <option value="Hard Drinks">Hard Drinks</option>
                <option value="Others">Others</option>
                <option value="Staples">Staples</option>
            </select>

            <label for="Store_Id">Store ID:</label>
            <select id="Store_Id" name="Store_Id" required>
                <option value="OUT001">OUT001</option>
                <option value="OUT010">OUT010</option>
                <option value="OUT013">OUT013</option>
                <option value="OUT017">OUT017</option>
                <option value="OUT018">OUT018</option>
                <option value="OUT019">OUT019</option>
                <option value="OUT027">OUT027</option>
                <option value="OUT035">OUT035</option>
                <option value="OUT045">OUT045</option>
                <option value="OUT046">OUT046</option>
                <option value="OUT049">OUT049</option>
            </select>

            <label for="Store_Size">Store Size:</label>
            <select id="Store_Size" name="Store_Size" required>
                <option value="Small">Small</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>

            <label for="Store_Location_City_Type">Store Location City Type:</label>
            <select id="Store_Location_City_Type" name="Store_Location_City_Type" required>
                <option value="Tier 1">Tier 1</option>
                <option value="Tier 2">Tier 2</option>
                <option value="Tier 3">Tier 3</option>
            </select>

            <label for="Store_Establishment_Year">Store Establishment Year:</label>
            <input type="number" id="Store_Establishment_Year" name="Store_Establishment_Year" value="2000" required>

            <label for="Store_Type">Store Type:</label>
            <select id="Store_Type" name="Store_Type" required>
                <option value="Supermarket Type1">Supermarket Type1</option>
                <option value="Grocery Store">Grocery Store</option>
                <option value="Supermarket Type2">Supermarket Type2</option>
                <option value="Supermarket Type3">Supermarket Type3</option>
            </select>

            <button type="submit">Predict Sales</button>
        </form>

        <div id="predictionResult"></div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const apiUrl = 'https://pharmbri-1051789343228.us-south1.run.app/predict'; // This is your deployed backend API URL
            const form = event.target;
            const formData = new FormData(form);
            const data = {};

            for (let [key, value] of formData.entries()) {
                // Convert numerical inputs to actual numbers
                if (['Product_Weight', 'Product_Allocated_Area', 'Product_MRP', 'Store_Establishment_Year'].includes(key)) {
                    data[key] = parseFloat(value);
                } else {
                    data[key] = value;
                }
            }
            // Product_Id is needed for consistency with the original data structure but dropped by backend
            data['Product_Id'] = 'TEMP_ID';

            const resultDiv = document.getElementById('predictionResult');
            resultDiv.innerHTML = 'Predicting...';
            resultDiv.className = '';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                resultDiv.innerHTML = `Predicted Sales: $${result.predicted_sales.toFixed(2)}`;
                resultDiv.style.backgroundColor = '#d4edda'; // Success color
                resultDiv.style.borderColor = '#28a745';
            } catch (error) {
                console.error('Prediction error:', error);
                resultDiv.innerHTML = `Error: ${error.message}`;
                resultDiv.className = 'error';
                resultDiv.style.backgroundColor = '#f8d7da'; // Error color
                resultDiv.style.borderColor = '#dc3545';
            }
        });
    </script>
</body>
</html>
